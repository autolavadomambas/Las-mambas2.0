<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAS MAMBAS - Auto Lavado, Detailing & Mensajería</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Orbitron:wght@600;800;900&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        mamba: {
                            red: '#E60012',
                            redhover: '#CD0010',
                            dark: '#0A0A0B',
                            card: '#141417',
                            border: '#282830',
                            silver: '#D1D5DB'
                        }
                    },
                    fontFamily: {
                        sans: ['Montserrat', 'sans-serif'],
                        tech: ['Orbitron', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #0A0A0B;
            color: #F3F4F6;
            font-family: 'Montserrat', sans-serif;
        }
        .mamba-red-gradient {
            background: linear-gradient(135deg, #E60012 0%, #99000C 100%);
        }
        .mamba-card {
            background-color: #141417;
            border: 1px solid #282830;
        }
        .main-nav-btn.active {
            background-color: #E60012;
            color: #ffffff;
        }
        .sub-tab-btn.active {
            border-bottom: 3px solid #E60012;
            color: #E60012;
            font-weight: 700;
        }

        /* ESTILOS PARA LAS CATEGORÍAS DESPLEGABLES DINÁMICAS */
        .category-accordion {
            background: #141417;
            border: 1px solid #282830;
            border-radius: 12px;
            margin-bottom: 15px;
            overflow: hidden;
            transition: border-color 0.3s ease;
        }
        .category-accordion:hover {
            border-color: #E60012;
        }
        .category-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 20px;
            background: #18181c;
            cursor: pointer;
            user-select: none;
        }
        .category-title {
            color: #ffffff;
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 0;
        }
        .category-arrow {
            color: #E60012;
            font-size: 0.9rem;
            transition: transform 0.3s ease;
        }
        .category-accordion.active .category-arrow {
            transform: rotate(180deg);
        }
        .category-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease-out;
            background: #0d0d0f;
            padding: 0 20px;
        }
        .category-accordion.active .category-content {
            max-height: 3000px;
            padding: 20px;
        }
        .service-subtext {
            font-size: 0.8rem;
            color: #9CA3AF;
            margin-bottom: 15px;
            line-height: 1.4;
        }
        .launch-badge {
            background: #E60012;
            color: #fff;
            font-size: 0.65rem;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .category-services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- HEADER -->
    <header class="bg-black/90 border-b border-mamba-border sticky top-0 z-50 backdrop-blur-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full mamba-red-gradient flex items-center justify-center text-white text-lg shadow-lg shadow-red-900/50">
                    <i class="fas fa-staff-snake"></i>
                </div>
                <div>
                    <h1 class="font-tech text-xl sm:text-2xl font-black tracking-wider text-white">LAS MAMBAS</h1>
                    <p class="text-xs text-gray-400 tracking-widest uppercase">Auto Lavado • Detailing • Mensajería</p>
                </div>
            </div>
            
            <div class="flex items-center gap-3">
                <a href="https://wa.me/50688818720" id="header-wa-btn" target="_blank" class="mamba-red-gradient hover:bg-red-700 text-white font-bold py-2 px-5 rounded-full text-sm flex items-center gap-2 transition shadow-md">
                    <i class="fab fa-whatsapp text-lg"></i> WhatsApp
                </a>
                <button onclick="toggleAdminClientes()" id="btn-admin-toggle" class="bg-gray-800 hover:bg-gray-700 text-gray-300 text-xs py-2 px-3 rounded-lg border border-mamba-border">
                    <i class="fas fa-lock"></i> Admin
                </button>
            </div>
        </div>
    </header>

    <!-- NAVEGACIÓN PRINCIPAL -->
    <div class="bg-black border-b border-mamba-border py-3">
        <div class="max-w-7xl mx-auto px-4 flex justify-center gap-4">
            <button onclick="seleccionarModuloPrincipal('lavado')" id="btn-modulo-lavado" class="main-nav-btn active px-6 py-2.5 rounded-xl font-tech text-xs sm:text-sm font-bold tracking-wider transition border border-mamba-border flex items-center gap-2">
                <i class="fas fa-car"></i> AUTO LAVADO & DETAILING
            </button>
            <button onclick="seleccionarModuloPrincipal('mensajeria')" id="btn-modulo-mensajeria" class="main-nav-btn px-6 py-2.5 rounded-xl font-tech text-xs sm:text-sm font-bold tracking-wider transition border border-mamba-border flex items-center gap-2 bg-gray-900 text-gray-400 hover:text-white">
                <i class="fas fa-motorcycle"></i> MENSAJERÍA EXPRESS
            </button>
        </div>
    </div>

    <!-- SUB-NAVEGACIÓN AUTO LAVADO -->
    <div id="subnav-lavado" class="border-b border-mamba-border bg-black/40">
        <div class="max-w-7xl mx-auto px-4 flex flex-wrap justify-center sm:justify-start gap-4 sm:gap-8 text-xs sm:text-sm font-semibold text-gray-400">
            <button onclick="switchSubTabLavado('servicios')" id="subtab-lav-servicios" class="sub-tab-btn active py-3 px-2 transition">
                <i class="fas fa-list text-mamba-red mr-1"></i> Servicios
            </button>
            <button onclick="switchSubTabLavado('cotizacion')" id="subtab-lav-cotizacion" class="sub-tab-btn py-3 px-2 transition">
                <i class="fas fa-calculator text-mamba-red mr-1"></i> Cotizador & Pedidos
            </button>
            <button onclick="switchSubTabLavado('citas')" id="subtab-lav-citas" class="sub-tab-btn py-3 px-2 transition">
                <i class="fas fa-calendar-alt text-mamba-red mr-1"></i> Citas
            </button>
            <button onclick="switchSubTabLavado('clientes')" id="subtab-lav-clientes" class="sub-tab-btn py-3 px-2 transition hidden">
                <i class="fas fa-users text-mamba-red mr-1"></i> Clientes
            </button>
        </div>
    </div>

    <!-- SUB-NAVEGACIÓN MENSAJERÍA -->
    <div id="subnav-mensajeria" class="border-b border-mamba-border bg-black/40 hidden">
        <div class="max-w-7xl mx-auto px-4 flex flex-wrap justify-center sm:justify-start gap-4 sm:gap-8 text-xs sm:text-sm font-semibold text-gray-400">
            <button onclick="switchSubTabMensajeria('calculadora')" id="subtab-msg-calculadora" class="sub-tab-btn active py-3 px-2 transition">
                <i class="fas fa-calculator text-mamba-red mr-1"></i> Calculadora de Ruta
            </button>
            <button onclick="switchSubTabMensajeria('cotizacion')" id="subtab-msg-cotizacion" class="sub-tab-btn py-3 px-2 transition">
                <i class="fas fa-file-invoice-dollar text-mamba-red mr-1"></i> Cotización Envíos
            </button>
        </div>
    </div>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full">

        <!-- ================= MÓDULO AUTO LAVADO ================= -->
        <div id="seccion-modulo-lavado" class="space-y-6">

            <!-- 1.1 SERVICIOS -->
            <div id="sec-lav-servicios" class="block space-y-6">
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border-b border-mamba-border pb-4">
                    <div>
                        <h2 class="text-2xl font-tech font-bold text-white">Catálogo de Lavado & Detailing</h2>
                        <p class="text-xs text-gray-400">Consulta los servicios de cuidado automotriz disponibles.</p>
                    </div>
                    <div class="flex gap-2">
                        <button id="btn-agregar-categoria-admin" onclick="crearNuevaCategoriaAdmin()" class="hidden bg-gray-800 border border-mamba-border hover:bg-gray-700 text-white text-xs font-bold py-2.5 px-4 rounded-lg items-center gap-2 shadow-md">
                            <i class="fas fa-folder-plus text-mamba-red"></i> Nueva Categoría
                        </button>
                        <button id="btn-agregar-servicio-admin" onclick="abrirModalServicio()" class="hidden mamba-red-gradient text-white text-xs font-bold py-2.5 px-4 rounded-lg items-center gap-2 shadow-md">
                            <i class="fas fa-plus"></i> Agregar Servicio
                        </button>
                    </div>
                </div>

                <!-- CONTENEDOR DINÁMICO DE CATEGORÍAS -->
                <div id="contenedor-categorias" class="space-y-4"></div>
            </div>

            <!-- 1.2 COTIZADOR Y PEDIDOS (ENVIAR A WHATSAPP) -->
            <div id="sec-lav-cotizacion" class="hidden space-y-6">
                <div class="text-center max-w-xl mx-auto">
                    <h2 class="text-2xl font-tech font-bold text-white mb-1">Cotizador y Pedido Express</h2>
                    <p class="text-xs text-gray-400">Arma tu paquete de servicios, añade tus vehículos y envíalo directo a nuestro WhatsApp.</p>
                </div>
                <div class="max-w-2xl mx-auto mamba-card rounded-2xl p-6 space-y-5">
                    <div>
                        <label class="block text-xs font-bold text-gray-300 uppercase mb-1">Tu Nombre</label>
                        <input type="text" id="cot-lav-cliente" placeholder="Ej: Carlos Gómez" class="w-full bg-black/60 border border-mamba-border rounded-lg p-2.5 text-xs text-white">
                    </div>

                    <!-- MÚLTIPLES VEHÍCULOS -->
                    <div class="border-t border-mamba-border pt-3">
                        <div class="flex justify-between items-center mb-2">
                            <label class="text-xs font-bold text-gray-300 uppercase">Vehículos y Placas</label>
                            <button type="button" onclick="agregarVehiculoCotizacion()" class="text-xs text-mamba-red font-bold hover:underline">
                                <i class="fas fa-plus mr-1"></i> Añadir otro vehículo
                            </button>
                        </div>
                        <div id="cot-vehiculos-container" class="space-y-2"></div>
                    </div>

                    <!-- SELECCIÓN DE SERVICIOS -->
                    <div class="border-t border-mamba-border pt-3 space-y-3">
                        <div class="flex justify-between items-center">
                            <label class="text-xs font-bold text-gray-300 uppercase">Servicios a Incluir</label>
                            <button type="button" onclick="agregarFilaServicioCotizacion()" class="text-xs text-mamba-red font-bold hover:underline">
                                <i class="fas fa-plus mr-1"></i> Añadir servicio
                            </button>
                        </div>
                        <div id="cot-servicios-container" class="space-y-2"></div>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-gray-300 uppercase mb-1">Notas / Instrucciones especiales</label>
                        <textarea id="cot-lav-notas" rows="2" placeholder="Ej: Necesito el servicio para hoy a las 2:00 PM..." class="w-full bg-black/60 border border-mamba-border rounded-lg p-2.5 text-xs text-white"></textarea>
                    </div>

                    <div class="border-t border-mamba-border pt-4 flex flex-col sm:flex-row justify-between items-center gap-4">
                        <div>
                            <span class="text-xs text-gray-400 block uppercase">Total Estimado:</span>
                            <span id="cot-lav-total-visual" class="font-tech text-2xl font-black text-mamba-red">₡0</span>
                        </div>
                        <button onclick="enviarCotizacionLavadoWhatsApp()" class="w-full sm:w-auto bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-6 rounded-lg text-xs uppercase tracking-wider flex items-center justify-center gap-2
